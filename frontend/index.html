<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hack2Find — Autonomous Hackathon Agent</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark text-light">
    <main class="container py-5">
      <h1 class="mb-3"><i class="fa-solid fa-robot"></i> Hack2Find</h1>
      <p class="lead">
        Universal Autonomous Hackathon Agent — hunts events, generates ideas, and
        builds prototypes with zero-cost AI inference.
      </p>
      <div id="status" class="alert alert-secondary">Connecting to agent core…</div>
      <pre id="log" class="bg-black p-3 rounded" style="min-height: 20rem"></pre>
    </main>

    <script type="module">
      const ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://") +
          location.hostname +
          ":8765/ws"
      );
      const log = document.getElementById("log");
      const status = document.getElementById("status");
      ws.onopen = () => {
        status.textContent = "Connected to agent core.";
        status.className = "alert alert-success";
      };
      ws.onmessage = (e) => {
        log.textContent = e.data + "\n" + log.textContent;
      };
      ws.onerror = () => {
        status.textContent = "Cannot reach agent core (is the backend running?).";
        status.className = "alert alert-danger";
      };
    </script>
  </body>
</html>
